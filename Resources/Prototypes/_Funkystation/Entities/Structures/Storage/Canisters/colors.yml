- type: entity
  parent: FuGasCanister
  id: FuWhiteCanister
  name: white canister
  components:
  - type: Sprite
    layers:
    - state: base-white
    - state: fixtures
    - state: paper-white
      visible: false
      map: [ "enum.PaperLabelVisuals.Layer" ]
    - state: integrity-unshaded-0
      map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
      visible: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          FuWhiteCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior

- type: entity
  parent: FuBaseGasCanisterBroken
  id: FuWhiteCanisterBroken
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: base-white
    - state: fixtures-broken


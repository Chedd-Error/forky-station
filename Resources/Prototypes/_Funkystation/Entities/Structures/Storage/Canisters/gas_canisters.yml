- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, BasePaperLabelableVisualized ]
  id: FuBaseGasCanister
  name: gas canister
  description: A canister that can contain any type of gas. It can be attached to connector ports using a wrench.
  components:
  - type: Animateable
  - type: InteractionOutline
  - type: Transform
  - type: Sprite
    sprite: _Funkystation/Structures/Storage/canister.rsi
    noRot: true
    layers:
    - state: base-gray
    - state: fixtures
    - state: paper-white
      visible: false
      map: [ "enum.PaperLabelVisuals.Layer" ]
    - state: integrity-unshaded-0
      map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
      shader: unshaded
      visible: false
    - state: mask
      map: [ "enum.MaxPressureVisualLayers.Base" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GasCanisterVisuals.TankInserted:
        tankInserted:
          False: { state: tank-connected, visible: false }
          True: { state: tank-connected, visible: true }
      enum.LockVisuals.Locked:
        locked:
          False: { state: locked-unshaded, visible: false }
          True: { state: locked-unshaded, shader: "unshaded", visible: true }
      enum.GasCanisterVisuals.PressureState:
        pressureLight:
          0: { state: valve-full, visible: false }
          1: { state: valve-full, visible: false }
          2: { state: valve-full, visible: true }
          3: { state: valve-full, visible: true }
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.StorageVisuals.Open:
        enum.PaperLabelVisuals.Layer:
          True: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper-white }
          Bounty: { state: paper-bounty }
          CaptainsPaper: { state: paper-captain }
          Invoice: { state: paper-invoice }
  - type: ActivatableUI
    key: enum.GasCanisterUiKey.Key
  - type: UIRequiresLock
    userInterfaceKeys:
    - enum.GasCanisterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasCanisterUiKey.Key:
        type: GasCanisterBoundUserInterface
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          FuBaseGasCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 190
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: ContainerContainer
    containers:
      tank_slot: !type:ContainerSlot {}
      paper_label: !type:ContainerSlot
  - type: NodeContainer
    nodes:
      port:
        !type:PortablePipeNode
        nodeGroupID: Pipe
        rotationsEnabled: false
        volume: 1
  - type: GasPortable
  - type: MaxPressureVisuals
    integrityMask: mask
  - type: GasCanister
    maxIntegrity: 15 # 5 times stronger than a gas tank
    integrity: 15
    maxReleasePressure: 1013.25
    safetyPressure: 10132.5 # High enough that liquid tanks don't burst immediately, with an extra 33% wiggle room to work with
    overpressure: 20265 # Purposefully high because cans react really fucking fast, may need to redo this value if reactions change!
    gasTankSlot:
      name: comp-gas-canister-slot-name-gas-tank
      ejectOnBreak: true
      whitelist:
        components:
          - GasTank
  - type: Explosive
    explosionType: Minibomb # Mostly a pressure wave explosive so primarily blunt damage
    maxIntensity: 100
    tileBreakScale: 0.2 # Keeps the can from spacing all the hot gas it has now vented :). If this proves to be too much it can be removed.
  - type: StaticPrice
    price: 200
  - type: AccessReader
    access: [["Atmospherics"], ["Engineering"], ["Research"]]
  - type: Lock
    locked: false
  - type: GuideHelp
    guides:
    - GasCanisters
  - type: Paintable
    group: FuCanisters

- type: entity
  abstract: true
  parent: FuBaseGasCanister
  id: FuBaseGasCanisterLocked
  components:
  - type: Lock
    locked: true

- type: entity
  parent: FuBaseGasCanister

# Broken Entities

- type: entity
  parent: BaseStructureDynamic
  id: FuBaseGasCanisterBroken
  name: broken gas canister
  description: A broken gas canister no longer able to hold gas. Can be salvaged for high-quality materials.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlasteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: InteractionOutline
  - type: Sprite
    sprite: _Funkystation/Structures/Storage/canister.rsi
    noRot: true
    layers:
    - state: base-gray
    - state: fixtures-broken
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
  - type: StaticPrice
    price: 125

